name: Test, build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libgl1
          libglib2.0-0 libxkbcommon0
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            archive: Bob-Archive-macOS-Intel.zip
          - name: Apple Silicon
            runner: macos-15
            archive: Bob-Archive-macOS-Apple-Silicon.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e '.[build]'
      - name: Build macOS application
        run: pyinstaller --clean --noconfirm BobArchive.spec
      - name: Verify application bundle
        run: test -x 'dist/Bob Archive.app/Contents/MacOS/Bob Archive'
      - name: Create portable ZIP
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Bob Archive.app' '${{ matrix.archive }}'
      - uses: actions/upload-artifact@v7
        with:
          name: Bob-Archive-macOS-${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Bob-Archive-macOS-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --generate-notes --verify-tag
