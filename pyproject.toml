[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-archive"
version = "0.1.0"
description = "A simple, local archive for scanned books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "PyMuPDF>=1.24,<2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
bob-archive = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

